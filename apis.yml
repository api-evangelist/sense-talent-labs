aid: sense-talent-labs
name: Sense Talent Labs
description: 'Sense Talent Labs, operating as Sense (sensehq.com), is an AI-powered talent
  engagement and recruiting automation platform founded in 2016 and used by staffing firms
  and enterprise talent-acquisition teams. The product suite spans recruiting automation,
  a talent CRM, campaigns and journeys, candidate scoring and matching, an AI recruiter and
  chatbot, SMS/WhatsApp messaging, interview scheduling and referrals. Sense publishes a
  public partner-facing REST API — the Sense API — documented as an OpenAPI 3.0.2 definition
  at developer.sensehq.com, which synchronizes applicant-tracking-system data (candidates,
  job orders, placements, submissions, companies, client contacts, internal users, appointments,
  certifications and leads) into the Sense platform to drive workflow automation. A companion
  Write-back API specification defines the event payloads Sense pushes back out to a customer
  or ATS endpoint.'
