apis:
- aid: sense-talent-labs-sense-api
  name: Sense API
  description: 'The Sense partner REST API used to synchronize applicant-tracking-system data
    into the Sense Talent Engagement Platform. It exposes batch upsert, single-entity fetch,
    partial update and dropdown possible-values management across ten entity types (Candidate,
    Placement, InternalUser, JobOrder, Company, ClientContact, Appointment, Submission,
    Certification, Lead), plus candidate resume upload. All POST operations are UPSERT
    operations keyed on the caller-supplied id, batched up to 500 records or 256 KB compressed.
    Authentication is OAuth 2.0 client credentials issuing a short-lived bearer JWT.'
  humanURL: https://developer.sensehq.com/
  baseURL: https://partner-api.sensehq.com/v1
