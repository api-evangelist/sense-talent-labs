- id: oidc
  name: OpenID Connect
  conforms: partial
  scope: write-back receiver only
  evidence: 'The Write-back API specification offers OIDC as an authentication option for the
    CUSTOMER-operated receiving endpoint ("a customer must provide Sense with a well-known OpenId
    Connect URL"). Sense is the OIDC client in that direction. Sense itself publishes no
    /.well-known/openid-configuration on any host (probed 2026-08-26, 404/403 on every host), so
    it is not an OIDC provider.'
