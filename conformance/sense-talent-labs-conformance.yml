summary: 'Sense conforms to the general-purpose web-API standards it uses — OpenAPI 3.0.2,
  OAuth 2.0 client credentials, bearer JWT, ISO 8601 — and to none of the interoperability
  standards for its own market. This matters more here than in most sectors, because the API''s
  entire purpose is syncing data out of applicant-tracking systems: Sense maintains bespoke
  connectors for Bullhorn, Workday, iCIMS, Greenhouse, JobDiva, SAP SuccessFactors, Oracle Taleo,
  Avionte, LaborEdge and Salesforce, and every ATS integrating with Sense must map its own model
  onto Sense''s proprietary entity shapes. This is not a scored deficiency — measured 2026-08-17,
  HR Open has zero detectable adoption across the whole catalog, so there is no de facto standard
  to have adopted.'
regulatory:
  regime: AI in employment decisions
  note: 'Sense is subject to automated-employment-decision-tool regulation rather than to a data-
    interoperability regime. Third-party assurance against NYC Local Law 144, the EU AI Act
    (Regulation 2024/1689), Colorado SB 205 and California FEHA is published for the Candidate
    Matching system by Warden AI — see security/sense-talent-labs-trust-center.yml. That assurance
    covers a model, not the API contract, and nothing in the contract itself declares it.'
