summary: 'Ten entity types modelling a staffing/recruiting book of business. Identity is
  caller-owned: every `id` is the primary key from the CALLER''s system (an ATS), explicitly not
  managed by Sense, and every relationship is a caller-supplied string reference rather than a
  server-issued key. There are no $ref links between entity schemas — the graph is expressed
  entirely through `*_id` reference fields — so referential integrity is the caller''s
  responsibility and the docs prescribe a fixed sync order to avoid dangling keys.'
identity:
  key_field: id
  type: string
  owner: caller
  quote: This represents the ID in your system and is not managed by Sense.
  id_prefixes: none — ids are opaque caller strings with no Sense-side prefix or format
sync_order:
- internal-users
- candidates
- client-contacts
- companies
- job-orders
- submissions
- placements
- leads
- certifications
- appointments
sync_order_rationale: To prevent referencing a foreign key that has not been processed yet.
