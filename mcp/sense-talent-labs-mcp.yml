agent_readiness_note: 'Even as a candidate this surface would be difficult to expose safely to an
  agent. There is no scope model (a credential carries full read/write over every entity in the
  tenant), no dry-run, no hard delete but also no documented restore, no list operations to
  discover ids, and POST is a lossy whole-entity replace. An agent that upserts a partial candidate
  record silently erases every field it omitted.'
